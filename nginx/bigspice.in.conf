# /etc/nginx/conf.d/bigspice.in.conf
#
# Production Nginx config for bigspice.in (Amazon Linux 2023 / AL2023)
#
# IMPORTANT: This file REPLACES bigspice.conf — delete the old file first:
#   sudo rm -f /etc/nginx/conf.d/bigspice.conf
#   sudo cp nginx/bigspice.in.conf /etc/nginx/conf.d/bigspice.in.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Layout:
#   port 80  → permanent redirect to HTTPS
#   port 443 → TLS termination; all traffic proxied to Gunicorn on 127.0.0.1:3000
#              /api/*  — JSON API for both web and mobile clients
#              /       — web application (HTML/JS/CSS)

# ── Rate-limiting zones ────────────────────────────────────────────────────────
# Shared memory zone: 10 MB ≈ 160 000 IP addresses
# "api_limit" — strict cap for auth endpoints (5 req/s per IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
# "general_limit" — relaxed cap for other API calls (30 req/s per IP)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# ── Upstream — Gunicorn ────────────────────────────────────────────────────────
upstream gunicorn {
    server 127.0.0.1:3000;
    keepalive 32;           # keep persistent connections to Gunicorn workers
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name bigspice.in www.bigspice.in;

    # Let's Encrypt ACME challenge — must stay on HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: permanent redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bigspice.in www.bigspice.in;

    # ── TLS / Let's Encrypt ────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/www.bigspice.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.bigspice.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────────────────────────
    # HSTS: force HTTPS for 1 year; include subdomains; allow preload list
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Prevent the page from being embedded in a frame on another origin
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Stop browsers from MIME-sniffing the declared content-type
    add_header X-Content-Type-Options "nosniff" always;
    # Modern replacement for X-XSS-Protection
    add_header X-XSS-Protection "1; mode=block" always;
    # Only send origin in the Referer header when navigating to same origin
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions policy — disable unused sensitive browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    # Content-Security-Policy — adjust src values to match your CDN / S3 bucket
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.amazonaws.com https://images.unsplash.com; connect-src 'self' https://bigspice.in https://www.bigspice.in; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'self';" always;

    # ── Logging ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/bigspice.access.log;
    error_log  /var/log/nginx/bigspice.error.log;

    # ── Client request limits ──────────────────────────────────────────────────
    client_max_body_size 10m;       # match Flask MAX_CONTENT_LENGTH

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Shared proxy settings ──────────────────────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Connection        "";   # required for keepalive upstream
    proxy_read_timeout  120s;               # match Gunicorn SSE timeout
    proxy_send_timeout  120s;

    # ── /api/* — REST API for web and mobile ──────────────────────────────────
    location /api/ {
        # Rate-limit auth endpoints more strictly
        location ~ ^/api/(login|signup) {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://gunicorn;
        }

        # General API rate limit
        limit_req zone=general_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://gunicorn;
    }

    # ── SSE streaming endpoint — disable buffering ─────────────────────────────
    location /api/messages/stream {
        proxy_pass          http://gunicorn;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;   # keep SSE connections open for 1 hour
        add_header          Cache-Control "no-cache";
        add_header          X-Accel-Buffering "no";
    }

    # ── Brand logos — proxy through Flask static handling ────────────────────
    location /logos/ {
        proxy_pass http://gunicorn;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Static uploads — proxy through Flask so deploy path stays repo-local ─
    location /uploads/ {
        proxy_pass http://gunicorn;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Web app — serve everything else ───────────────────────────────────────
    location / {
        proxy_pass http://gunicorn;
    }
}
