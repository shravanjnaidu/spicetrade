<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="/logos/bigspicebubble.png"
      type="image/png"
      sizes="32x32"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>All Listings — BigSpice</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="/"
        ><img src="/logos/bigspicelogo.png" alt="BigSpice logo" class="logo"
      /></a>
      <div class="header-right"></div>
    </header>

    <main class="container" style="margin-top: 40px; flex: 1 0 auto">
      <div class="section-header">
        <h2>All Listings</h2>
        <p style="color: #666; margin: 0">Browse all available listings</p>
      </div>
      <div id="adsList" class="ads-grid" style="margin-top: 24px">
        Loading listings...
      </div>
    </main>

    <footer class="footer">
      &copy; Group of Spice Cloud Technologies, Canada, ESTB 2022 &nbsp;|&nbsp;
      <a href="/faq.html" style="color: #fff; text-decoration: underline"
        >FAQ</a
      >
    </footer>

    <script src="/app.js"></script>
    <script>
      async function loadAllListings() {
        const list = document.getElementById("adsList");
        if (!list) return;
        list.innerHTML = "Loading...";

        const params = new URLSearchParams(window.location.search);
        const categoryFilter = params.get("category");
        const qFilter = params.get("q");

        try {
          const res = await fetch("/api/ads");
          const ads = await res.json();

          const filtered = ads.filter((a) => {
            // Category match
            const catOk =
              !categoryFilter ||
              (a.category || "").toLowerCase() === categoryFilter.toLowerCase();

            // Text search match
            if (!qFilter) return catOk;
            const q = qFilter.toLowerCase();
            const textOk =
              (a.title || "").toLowerCase().includes(q) ||
              (a.description || "").toLowerCase().includes(q) ||
              (a.category || "").toLowerCase().includes(q) ||
              (a.author || "").toLowerCase().includes(q) ||
              (a.storeName || "").toLowerCase().includes(q) ||
              (Array.isArray(a.tags) &&
                a.tags.some((t) => t.toLowerCase().includes(q)));

            return catOk && textOk;
          });

          // Update page heading
          const titleEl = document.querySelector(".section-header h2");
          const subtitleEl = document.querySelector(".section-header p");
          if (qFilter && !categoryFilter) {
            if (titleEl) titleEl.textContent = `Results for "${qFilter}"`;
            if (subtitleEl)
              subtitleEl.textContent = `${filtered.length} listing${
                filtered.length !== 1 ? "s" : ""
              } found`;
            document.title = `"${qFilter}" — BigSpice`;
          } else if (categoryFilter) {
            if (titleEl) titleEl.textContent = categoryFilter;
            if (subtitleEl)
              subtitleEl.textContent = `Showing listings in "${categoryFilter}"`;
            document.title = `${categoryFilter} — BigSpice`;
          }

          renderAds(filtered);
        } catch (err) {
          list.innerHTML = "<p>Error loading listings</p>";
        }
      }

      function renderAds(ads) {
        const list = document.getElementById("adsList");
        if (!list) return;
        if (!ads || !ads.length) {
          const catFilter = new URLSearchParams(window.location.search).get(
            "category",
          );
          const qf = new URLSearchParams(window.location.search).get("q");
          if (qf) {
            list.innerHTML = `<p>No listings found for <strong>&ldquo;${qf}&rdquo;</strong>. <a href="/all-listings.html">View all listings</a></p>`;
          } else if (catFilter) {
            list.innerHTML = `<p>No listings found in <strong>${catFilter}</strong>. <a href="/all-listings.html">View all listings</a></p>`;
          } else {
            list.innerHTML = "<p>No listings</p>";
          }
          return;
        }
        list.innerHTML = "";
        ads.forEach((a) => {
          const el = document.createElement("article");
          el.className = "ad";
          el.style.cursor = "pointer";
          el.addEventListener("click", () => {
            window.location.href = `/listing.html?id=${a.id}`;
          });

          if (a.imageUrl) {
            const img = document.createElement("img");
            img.className = "ad-image";
            img.src = a.imageUrl;
            img.alt = a.title || "ad image";
            img.loading = "lazy";
            el.appendChild(img);
          }

          const body = document.createElement("div");
          body.className = "ad-body";

          const h3 = document.createElement("h3");
          h3.textContent = a.title || "";
          body.appendChild(h3);

          const p = document.createElement("p");
          p.textContent = a.description || "";
          body.appendChild(p);

          const meta = document.createElement("div");
          meta.style.display = "flex";
          meta.style.justifyContent = "space-between";
          meta.style.alignItems = "center";
          meta.style.marginTop = "8px";

          const author = document.createElement("small");
          author.textContent = `by ${a.author || "anonymous"}`;
          meta.appendChild(author);

          const date = document.createElement("small");
          date.textContent = a.createdAt
            ? new Date(a.createdAt).toLocaleDateString()
            : "";
          meta.appendChild(date);

          body.appendChild(meta);
          el.appendChild(body);

          list.appendChild(el);
        });
      }

      loadAllListings();
    </script>
  </body>
</html>
