<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="/logos/bigspicebubble.png"
      type="image/png"
      sizes="32x32"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Password — BigSpice</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .reset-card {
        max-width: 420px;
        margin: 60px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
        padding: 40px 36px;
      }
      .reset-card h2 {
        margin: 0 0 8px;
        font-size: 22px;
        color: #222;
      }
      .reset-card p.sub {
        color: #666;
        font-size: 14px;
        margin: 0 0 24px;
        line-height: 1.5;
      }
      .reset-card label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #333;
        margin-bottom: 4px;
      }
      .reset-card input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1.5px solid #ddd;
        border-radius: 6px;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s;
        margin-bottom: 20px;
      }
      .reset-card input[type="password"]:focus {
        border-color: #d35400;
      }
      .reset-card .btn-submit {
        width: 100%;
        background: #d35400;
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
      }
      .reset-card .btn-submit:hover {
        background: #b84800;
      }
      .reset-card .btn-submit:disabled {
        background: #e0a070;
        cursor: not-allowed;
      }
      #msg {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 6px;
        font-size: 14px;
        display: none;
      }
      #msg.success {
        background: #eafaf1;
        color: #1e8449;
        border: 1px solid #a9dfbf;
      }
      #msg.error {
        background: #fdf2f2;
        color: #c0392b;
        border: 1px solid #f1aeb5;
      }
      .hint {
        font-size: 12px;
        color: #999;
        margin-top: -14px;
        margin-bottom: 18px;
      }
      #invalidToken {
        display: none;
        text-align: center;
        padding: 20px;
      }
      #invalidToken p {
        color: #c0392b;
        margin-bottom: 16px;
      }
      .signin-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #d35400;
        text-decoration: none;
      }
      .signin-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a href="/"
        ><img src="/logos/bigspicelogo.png" alt="BigSpice logo" class="logo"
      /></a>
      <nav>
        <a href="/login.html" class="btn">Sign in</a>
      </nav>
    </header>

    <main class="container">
      <div class="reset-card">
        <div id="invalidToken">
          <p>&#x26A0; This password reset link is invalid or has expired.</p>
          <a
            href="/forgot-password.html"
            class="btn"
            style="display: inline-block; padding: 10px 24px"
            >Request a new link</a
          >
        </div>

        <div id="resetForm">
          <h2>Set a new password</h2>
          <p class="sub">Choose a strong password for your BigSpice account.</p>
          <form id="resetPasswordForm">
            <input type="hidden" id="tokenInput" />
            <label for="newPassword">New password</label>
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              placeholder="Minimum 8 characters"
              required
              minlength="8"
            />
            <p class="hint">At least 8 characters.</p>
            <label for="confirmPassword">Confirm new password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Repeat your new password"
              required
              minlength="8"
            />
            <button
              type="submit"
              class="btn-submit"
              id="submitBtn"
              style="margin-top: 4px"
            >
              Update password
            </button>
          </form>
          <div id="msg"></div>
          <a href="/login.html" class="signin-link">&#8592; Back to Sign in</a>
        </div>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token") || "";

      if (!token) {
        document.getElementById("resetForm").style.display = "none";
        document.getElementById("invalidToken").style.display = "block";
      } else {
        document.getElementById("tokenInput").value = token;
      }

      document
        .getElementById("resetPasswordForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("submitBtn");
          const msg = document.getElementById("msg");
          const password = document.getElementById("newPassword").value;
          const confirm = document.getElementById("confirmPassword").value;

          msg.style.display = "none";

          if (password !== confirm) {
            msg.style.display = "block";
            msg.className = "error";
            msg.textContent = "Passwords do not match.";
            return;
          }
          if (password.length < 8) {
            msg.style.display = "block";
            msg.className = "error";
            msg.textContent = "Password must be at least 8 characters.";
            return;
          }

          btn.disabled = true;
          btn.textContent = "Updating…";

          try {
            const res = await fetch("/api/reset-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, password }),
            });
            const j = await res.json();
            msg.style.display = "block";
            if (j.success) {
              msg.className = "success";
              msg.textContent =
                "Password updated! You can now sign in with your new password.";
              document.getElementById("resetPasswordForm").style.display =
                "none";
              setTimeout(() => {
                window.location.href = "/login.html";
              }, 2500);
            } else {
              msg.className = "error";
              msg.textContent =
                j.error ||
                "Something went wrong. Please request a new reset link.";
              if (
                j.error &&
                (j.error.includes("expired") || j.error.includes("Invalid"))
              ) {
                document.getElementById("resetForm").style.display = "none";
                document.getElementById("invalidToken").style.display = "block";
              }
            }
          } catch (err) {
            msg.style.display = "block";
            msg.className = "error";
            msg.textContent = "Network error. Please try again.";
          } finally {
            btn.disabled = false;
            btn.textContent = "Update password";
          }
        });
    </script>
  </body>
</html>
