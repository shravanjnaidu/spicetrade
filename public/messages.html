<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="/logos/bigspicebubble.png"
      type="image/png"
      sizes="32x32"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Messages — BigSpice</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .messages-container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 16px;
      }
      .messages-layout {
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 20px;
        height: calc(100vh - 200px);
        min-height: 600px;
      }
      .conversations-panel {
        background: #fff;
        border: 1px solid #e9e9e9;
        border-radius: 12px;
        overflow-y: auto;
      }
      .conversations-header {
        padding: 20px;
        border-bottom: 1px solid #e9e9e9;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .conversations-header h2 {
        margin: 0;
        font-size: 20px;
      }
      .new-chat-btn {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .new-chat-btn:hover {
        opacity: 0.88;
      }
      .user-search-panel {
        padding: 12px 16px;
        border-bottom: 1px solid #e9e9e9;
        background: #fafafa;
        display: none;
      }
      .user-search-panel.open {
        display: block;
      }
      .user-search-input {
        width: 100%;
        padding: 9px 14px;
        border: 1px solid #ddd;
        border-radius: 20px;
        font-size: 14px;
        box-sizing: border-box;
        outline: none;
      }
      .user-search-input:focus {
        border-color: var(--accent);
      }
      .search-results {
        margin-top: 8px;
        max-height: 240px;
        overflow-y: auto;
        border-radius: 8px;
        background: white;
        border: 1px solid #e9e9e9;
        display: none;
      }
      .search-results.open {
        display: block;
      }
      .conversation-item {
        padding: 16px 20px;
        border-bottom: 1px solid #f5f5f5;
        cursor: pointer;
        transition: background 0.2s;
      }
      .conversation-item:hover {
        background: #f9f9f9;
      }
      .conversation-item.active {
        background: #f0f4ff;
        border-left: 3px solid var(--accent);
      }
      .conversation-item.has-unread {
        background: #fffbf0;
        font-weight: 500;
      }
      .conversation-item.has-unread .conversation-last-message {
        color: #333;
        font-weight: 500;
      }
      .conversation-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }
      .conversation-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
      }
      .conversation-avatar-fallback {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--accent);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 16px;
      }
      .conversation-info {
        flex: 1;
        min-width: 0;
      }
      .conversation-name {
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conversation-store {
        font-size: 12px;
        color: #666;
        margin-bottom: 4px;
      }
      .conversation-last-message {
        font-size: 13px;
        color: #888;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conversation-time {
        font-size: 11px;
        color: #999;
      }
      .conversation-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
      }
      .unread-badge {
        background: #ff4444;
        color: white;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 10px;
        min-width: 20px;
        text-align: center;
        display: inline-block;
      }
      .chat-panel {
        background: #fff;
        border: 1px solid #e9e9e9;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .chat-header {
        padding: 20px;
        border-bottom: 1px solid #e9e9e9;
        background: #fafafa;
      }
      .chat-header-content {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .chat-header h3 {
        margin: 0 0 4px 0;
        font-size: 18px;
      }
      .chat-header-subtitle {
        font-size: 13px;
        color: #666;
      }
      .messages-area {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background: #f9f9f9;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .message {
        max-width: 70%;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .message.sent {
        align-self: flex-end;
        align-items: flex-end;
      }
      .message.received {
        align-self: flex-start;
        align-items: flex-start;
      }
      .message-bubble {
        padding: 10px 14px;
        border-radius: 12px;
        word-wrap: break-word;
      }
      .message.sent .message-bubble {
        background: var(--accent);
        color: white;
        border-bottom-right-radius: 4px;
      }
      .message.received .message-bubble {
        background: white;
        border: 1px solid #e9e9e9;
        border-bottom-left-radius: 4px;
      }
      .message-time {
        font-size: 11px;
        color: #999;
        padding: 0 4px;
      }
      .message-sender {
        font-size: 12px;
        font-weight: 600;
        color: #666;
        padding: 0 4px;
      }
      .message-input-area {
        padding: 20px;
        border-top: 1px solid #e9e9e9;
        background: white;
      }
      .message-input-form {
        display: flex;
        gap: 12px;
      }
      .message-input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 24px;
        font-size: 14px;
        outline: none;
      }
      .message-input:focus {
        border-color: var(--accent);
      }
      .send-button {
        padding: 12px 24px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 24px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .send-button:hover {
        opacity: 0.9;
      }
      .send-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .chat-back-btn {
        display: none;
        align-items: center;
        gap: 6px;
        background: none;
        border: none;
        font-size: 14px;
        font-weight: 600;
        color: #007185;
        cursor: pointer;
        padding: 0;
        margin-bottom: 8px;
      }
      .chat-back-btn:hover {
        color: #c45500;
      }
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #999;
        text-align: center;
        padding: 40px;
      }
      .empty-state h3 {
        margin: 16px 0 8px 0;
        color: #666;
      }
      @media (max-width: 768px) {
        .messages-container {
          margin: 0;
          padding: 0 8px;
        }
        .messages-layout {
          grid-template-columns: 1fr;
          height: calc(100vh - 130px);
        }
        .conversations-panel {
          display: block;
        }
        .chat-panel {
          display: none;
        }
        .chat-panel.mobile-active {
          display: flex;
        }
        .chat-back-btn {
          display: inline-flex !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a href="/"
        ><img src="/logos/bigspicelogo.png" alt="BigSpice logo" class="logo"
      /></a>
      <div class="header-right"></div>
    </header>

    <main class="messages-container">
      <h1 style="margin-bottom: 24px">Messages</h1>

      <div class="messages-layout">
        <!-- Conversations List -->
        <div class="conversations-panel">
          <div class="conversations-header">
            <h2>Conversations</h2>
            <button class="new-chat-btn" onclick="toggleSearch()">
              + New Chat
            </button>
          </div>
          <div class="user-search-panel" id="searchPanel">
            <input
              type="text"
              class="user-search-input"
              id="userSearchInput"
              placeholder="Search by name or store..."
              oninput="handleSearchInput(this.value)"
              autocomplete="off"
            />
            <div class="search-results" id="searchResults"></div>
          </div>
          <div id="conversationsList">
            <!-- Conversations will be loaded here -->
          </div>
        </div>

        <!-- Chat Panel -->
        <div class="chat-panel" id="chatPanel">
          <div class="empty-state">
            <svg
              width="64"
              height="64"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
              ></path>
            </svg>
            <h3>No conversation selected</h3>
            <p>
              Select one from the left — or click <strong>+ New Chat</strong> to
              start a new conversation.
            </p>
          </div>
        </div>
      </div>
    </main>

    <script src="/app.js"></script>
    <script>
      const currentUser = JSON.parse(
        localStorage.getItem("bigspice_user") || "null",
      );

      if (!currentUser || !currentUser.id) {
        window.location.href = "/login.html";
      }

      let conversations = [];
      let currentConversationId = null;
      let messages = [];
      let sseConnection = null;

      async function loadConversations() {
        try {
          const res = await fetch(`/api/conversations/${currentUser.id}`);
          conversations = await res.json();
          renderConversations();
        } catch (err) {
          console.error("Error loading conversations:", err);
        }
      }

      function renderConversations() {
        const list = document.getElementById("conversationsList");

        if (conversations.length === 0) {
          list.innerHTML =
            '<div class="empty-state" style="padding:32px 20px;"><p style="margin:0;color:#999;">No conversations yet.<br>Click <strong>+ New Chat</strong> to start one.</p></div>';
          return;
        }

        list.innerHTML = conversations
          .map((conv) => {
            const isCurrentUserBuyer = currentUser.id === conv.buyerId;
            const otherUser = isCurrentUserBuyer
              ? {
                  name: conv.sellerName,
                  email: conv.sellerEmail,
                  picture: conv.sellerPicture,
                  store: conv.storeName,
                }
              : {
                  name: conv.buyerName,
                  email: conv.buyerEmail,
                  picture: conv.buyerPicture,
                };

            const initial = (otherUser.name || otherUser.email)
              .charAt(0)
              .toUpperCase();
            const avatar = otherUser.picture
              ? `<img src="${otherUser.picture}" class="conversation-avatar" alt="${otherUser.name}">`
              : `<div class="conversation-avatar-fallback">${initial}</div>`;

            const time = conv.lastMessageTime
              ? new Date(conv.lastMessageTime).toLocaleTimeString([], {
                  hour: "2-digit",
                  minute: "2-digit",
                })
              : "";

            const hasUnread = conv.unreadCount > 0;
            const unreadClass = hasUnread ? "has-unread" : "";

            return `
            <div class="conversation-item ${
              currentConversationId === conv.id ? "active" : ""
            } ${unreadClass}" 
                 onclick="selectConversation(${conv.id})">
              <div class="conversation-header">
                ${avatar}
                <div class="conversation-info">
                  <div class="conversation-name">${
                    otherUser.name || otherUser.email
                  }</div>
                  ${
                    otherUser.store
                      ? `<div class="conversation-store">${otherUser.store}</div>`
                      : ""
                  }
                  ${
                    conv.lastMessage
                      ? `<div class="conversation-last-message">${conv.lastMessage}</div>`
                      : ""
                  }
                </div>
                <div class="conversation-meta">
                  ${time ? `<div class="conversation-time">${time}</div>` : ""}
                  ${
                    hasUnread
                      ? `<span class="unread-badge">${conv.unreadCount}</span>`
                      : ""
                  }
                </div>
              </div>
            </div>
          `;
          })
          .join("");
      }

      async function selectConversation(conversationId) {
        currentConversationId = conversationId;
        renderConversations();
        await loadMessages(conversationId);
        renderChatPanel();
        // On mobile: hide conversation list, show chat panel
        if (window.innerWidth <= 768) {
          document.querySelector(".conversations-panel").style.display = "none";
          document.getElementById("chatPanel").classList.add("mobile-active");
        }
      }

      function showConversationList() {
        document.querySelector(".conversations-panel").style.display = "";
        document.getElementById("chatPanel").classList.remove("mobile-active");
        currentConversationId = null;
        renderConversations();
      }

      async function loadMessages(conversationId) {
        try {
          const res = await fetch(`/api/messages/${conversationId}`);
          messages = await res.json();
          renderMessages();

          // Mark messages as read
          await fetch(`/api/messages/mark-read/${conversationId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ userId: currentUser.id }),
          });
        } catch (err) {
          console.error("Error loading messages:", err);
        }
      }

      function renderChatPanel() {
        const panel = document.getElementById("chatPanel");
        const conv = conversations.find((c) => c.id === currentConversationId);

        if (!conv) return;

        const isCurrentUserBuyer = currentUser.id === conv.buyerId;
        const otherUser = isCurrentUserBuyer
          ? {
              name: conv.sellerName,
              email: conv.sellerEmail,
              picture: conv.sellerPicture,
              store: conv.storeName,
            }
          : {
              name: conv.buyerName,
              email: conv.buyerEmail,
              picture: conv.buyerPicture,
            };

        const initial = (otherUser.name || otherUser.email)
          .charAt(0)
          .toUpperCase();
        const avatar = otherUser.picture
          ? `<img src="${otherUser.picture}" class="conversation-avatar" alt="${otherUser.name}">`
          : `<div class="conversation-avatar-fallback">${initial}</div>`;

        panel.innerHTML = `
          <div class="chat-header">
            <button class="chat-back-btn" onclick="showConversationList()">&#8592; Conversations</button>
            <div class="chat-header-content">
              ${avatar}
              <div>
                <h3>${otherUser.name || otherUser.email}</h3>
                ${
                  otherUser.store
                    ? `<div class="chat-header-subtitle">${otherUser.store}</div>`
                    : ""
                }
              </div>
            </div>
          </div>
          <div class="messages-area" id="messagesArea">
            <!-- Messages will be loaded here -->
          </div>
          <div class="message-input-area">
            <form class="message-input-form" id="messageForm">
              <input 
                type="text" 
                class="message-input" 
                id="messageInput" 
                placeholder="Type a message..."
                required
              />
              <button type="submit" class="send-button">Send</button>
            </form>
          </div>
        `;

        // Attach form handler
        document
          .getElementById("messageForm")
          .addEventListener("submit", handleSendMessage);

        renderMessages();
      }

      function renderMessages() {
        const area = document.getElementById("messagesArea");
        if (!area) return;

        if (messages.length === 0) {
          area.innerHTML =
            '<div class="empty-state"><p>No messages yet. Start the conversation!</p></div>';
          return;
        }

        area.innerHTML = messages
          .map((msg) => {
            const isSent = msg.senderId === currentUser.id;
            const time = new Date(msg.createdAt).toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit",
            });

            return `
            <div class="message ${isSent ? "sent" : "received"}">
              ${
                !isSent
                  ? `<div class="message-sender">${
                      msg.senderName || msg.senderEmail
                    }</div>`
                  : ""
              }
              <div class="message-bubble">${escapeHtml(msg.message)}</div>
              <div class="message-time">${time}</div>
            </div>
          `;
          })
          .join("");

        // Scroll to bottom
        area.scrollTop = area.scrollHeight;
      }

      async function handleSendMessage(e) {
        e.preventDefault();

        const input = document.getElementById("messageInput");
        const message = input.value.trim();

        if (!message) return;

        try {
          const res = await fetch("/api/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              conversationId: currentConversationId,
              senderId: currentUser.id,
              message: message,
            }),
          });

          const result = await res.json();

          if (result.success) {
            input.value = "";
            // SSE will trigger loadMessages + loadConversations for both parties
          } else {
            alert("Failed to send message");
          }
        } catch (err) {
          console.error("Error sending message:", err);
          alert("Failed to send message");
        }
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function setupSSE() {
        if (sseConnection) sseConnection.close();
        sseConnection = new EventSource(`/api/sse/${currentUser.id}`);

        sseConnection.onmessage = (e) => {
          const event = JSON.parse(e.data);
          if (event.type === "new_message") {
            loadConversations();
            if (currentConversationId === event.data.conversationId) {
              loadMessages(event.data.conversationId);
            }
          }
        };

        sseConnection.onerror = () => {
          sseConnection.close();
          setTimeout(setupSSE, 3000); // reconnect after 3s
        };
      }

      window.addEventListener("beforeunload", () => {
        if (sseConnection) sseConnection.close();
      });

      // ── New Conversation (user search) ────────────────────────────────────
      let searchOpen = false;
      let searchDebounce = null;

      function toggleSearch() {
        searchOpen = !searchOpen;
        const panel = document.getElementById("searchPanel");
        const resultsEl = document.getElementById("searchResults");
        if (searchOpen) {
          panel.classList.add("open");
          document.getElementById("userSearchInput").focus();
        } else {
          panel.classList.remove("open");
          resultsEl.classList.remove("open");
          resultsEl.innerHTML = "";
          document.getElementById("userSearchInput").value = "";
        }
      }

      function handleSearchInput(value) {
        clearTimeout(searchDebounce);
        const resultsEl = document.getElementById("searchResults");
        if (!value || value.length < 2) {
          resultsEl.classList.remove("open");
          resultsEl.innerHTML = "";
          return;
        }
        searchDebounce = setTimeout(() => searchUsers(value), 250);
      }

      async function searchUsers(q) {
        try {
          const res = await fetch(
            `/api/users/search?q=${encodeURIComponent(q)}&excludeId=${currentUser.id}`,
          );
          const users = await res.json();
          renderSearchResults(users);
        } catch (err) {
          console.error("Error searching users:", err);
        }
      }

      function renderSearchResults(users) {
        const resultsEl = document.getElementById("searchResults");
        if (!users.length) {
          resultsEl.innerHTML =
            '<div style="padding:14px 16px;color:#999;font-size:14px;">No users found</div>';
          resultsEl.classList.add("open");
          return;
        }
        resultsEl.innerHTML = users
          .map((u) => {
            const initial = (u.name || u.email || "U").charAt(0).toUpperCase();
            const avatar = u.profilePicture
              ? `<img src="${u.profilePicture}" class="conversation-avatar" alt="${escapeHtml(u.name || "")}">`
              : `<div class="conversation-avatar-fallback">${initial}</div>`;
            return `
            <div class="conversation-item" onclick="startNewConversation(${u.id})" style="cursor:pointer">
              <div class="conversation-header">
                ${avatar}
                <div class="conversation-info">
                  <div class="conversation-name">${escapeHtml(u.name || u.email || "—")}</div>
                  ${u.storeName ? `<div class="conversation-store">${escapeHtml(u.storeName)}</div>` : ""}
                  <div class="conversation-store" style="text-transform:capitalize">${u.role || "user"}</div>
                </div>
              </div>
            </div>`;
          })
          .join("");
        resultsEl.classList.add("open");
      }

      async function startNewConversation(targetUserId) {
        try {
          const res = await fetch("/api/conversations", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              buyerId: currentUser.id,
              sellerId: targetUserId,
            }),
          });
          const result = await res.json();
          if (result.success) {
            // Close search panel
            searchOpen = true;
            toggleSearch();
            // Reload conversations and open the new one
            await loadConversations();
            selectConversation(result.conversationId);
          } else {
            alert("Could not start conversation. Please try again.");
          }
        } catch (err) {
          console.error("Error starting conversation:", err);
          alert("Failed to start conversation.");
        }
      }
      // ─────────────────────────────────────────────────────────────────────

      // Initial load: fetch conversations, then deep-link if URL has ?conversation=X
      // If the conversation isn't in the first load (race with just-created conv),
      // retry once after a short delay so the DB has time to commit.
      async function initialLoad() {
        await loadConversations();
        const convId = parseInt(
          new URLSearchParams(window.location.search).get("conversation"),
        );
        if (!convId) return;

        if (conversations.find((c) => c.id === convId)) {
          selectConversation(convId);
        } else {
          // Retry once — the conversation may have been created moments ago
          setTimeout(async () => {
            await loadConversations();
            if (conversations.find((c) => c.id === convId)) {
              selectConversation(convId);
            }
          }, 800);
        }
      }
      initialLoad();
      setupSSE();
    </script>
  </body>
</html>
