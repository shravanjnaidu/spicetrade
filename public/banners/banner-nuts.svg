<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300" width="1400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3200"/>
      <stop offset="55%" stop-color="#9B5A00"/>
      <stop offset="100%" stop-color="#C8860A"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="300" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1230" cy="150" r="270" fill="rgba(255,255,255,0.04)"/>
  <circle cx="1350" cy="280" r="155" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1175" cy="15"  r="125" fill="rgba(255,255,255,0.04)"/>
  <circle cx="115"  cy="30"  r="145" fill="rgba(255,255,255,0.04)"/>
  <circle cx="60"   cy="258" r="108" fill="rgba(255,255,255,0.04)"/>

  <!-- Decorative nut/hexagon shapes left -->
  <polygon points="310,70 330,58 350,70 350,94 330,106 310,94" fill="rgba(230,180,60,0.25)"/>
  <polygon points="275,200 292,189 310,200 310,222 292,233 275,222" fill="rgba(230,180,60,0.2)"/>
  <polygon points="355,160 370,151 385,160 385,178 370,187 355,178" fill="rgba(230,180,60,0.18)"/>

  <!-- Decorative nut/hexagon shapes right -->
  <polygon points="1055,65  1072,55  1090,65  1090,85  1072,95  1055,85" fill="rgba(230,180,60,0.22)"/>
  <polygon points="1075,195 1090,186 1108,195 1108,215 1090,224 1075,215" fill="rgba(230,180,60,0.18)"/>

  <!-- Golden shimmer dots -->
  <circle cx="320" cy="250" r="5" fill="rgba(255,220,80,0.4)"/>
  <circle cx="380" cy="110" r="4" fill="rgba(255,220,80,0.3)"/>
  <circle cx="1050" cy="240" r="5" fill="rgba(255,220,80,0.35)"/>
  <circle cx="1100" cy="100" r="4" fill="rgba(255,220,80,0.3)"/>

  <!-- Border lines -->
  <rect x="0" y="0" width="1400" height="3" fill="rgba(255,210,60,0.35)"/>
  <rect x="0" y="297" width="1400" height="3" fill="rgba(255,210,60,0.35)"/>

  <!-- Category tag pill -->
  <rect x="542" y="52" width="316" height="30" rx="15" fill="rgba(255,255,255,0.15)"/>
  <text x="700" y="73" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="rgba(255,255,255,0.92)" text-anchor="middle" font-weight="bold" letter-spacing="2">FOOD &amp; AGRICULTURE</text>

  <!-- Main heading -->
  <text x="700" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">Nuts &amp; Dry Fruits</text>

  <!-- Subtitle -->
  <text x="700" y="191" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="rgba(255,255,255,0.85)" text-anchor="middle">Best grades at wholesale prices · Source directly from processors</text>

  <!-- CTA button -->
  <rect x="576" y="216" width="248" height="48" rx="24" fill="url(#btnGrad)" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>
  <text x="700" y="246" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Browse Listings  &#8594;</text>
</svg>
