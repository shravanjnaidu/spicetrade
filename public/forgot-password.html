<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="/logos/bigspicebubble.png"
      type="image/png"
      sizes="32x32"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forgot Password — BigSpice</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .forgot-card {
        max-width: 420px;
        margin: 60px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
        padding: 40px 36px;
      }
      .forgot-card h2 {
        margin: 0 0 8px;
        font-size: 22px;
        color: #222;
      }
      .forgot-card p.sub {
        color: #666;
        font-size: 14px;
        margin: 0 0 24px;
        line-height: 1.5;
      }
      .forgot-card label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #333;
        margin-bottom: 4px;
      }
      .forgot-card input[type="email"] {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1.5px solid #ddd;
        border-radius: 6px;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s;
        margin-bottom: 20px;
      }
      .forgot-card input[type="email"]:focus {
        border-color: #d35400;
      }
      .forgot-card .btn-submit {
        width: 100%;
        background: #d35400;
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
      }
      .forgot-card .btn-submit:hover {
        background: #b84800;
      }
      .forgot-card .btn-submit:disabled {
        background: #e0a070;
        cursor: not-allowed;
      }
      #msg {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 6px;
        font-size: 14px;
        display: none;
      }
      #msg.success {
        background: #eafaf1;
        color: #1e8449;
        border: 1px solid #a9dfbf;
      }
      #msg.error {
        background: #fdf2f2;
        color: #c0392b;
        border: 1px solid #f1aeb5;
      }
      .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #d35400;
        text-decoration: none;
      }
      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a href="/"
        ><img src="/logos/bigspicelogo.png" alt="BigSpice logo" class="logo"
      /></a>
      <nav>
        <a href="/login.html" class="btn">Sign in</a>
        <a href="/signup.html" class="btn">Sign up</a>
      </nav>
    </header>

    <main class="container">
      <div class="forgot-card">
        <h2>Forgot your password?</h2>
        <p class="sub">
          Enter your registered email address and we'll send you a link to reset
          your password.
        </p>
        <form id="forgotForm">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@company.com"
            required
          />
          <button type="submit" class="btn-submit" id="submitBtn">
            Send reset link
          </button>
        </form>
        <div id="msg"></div>
        <a href="/login.html" class="back-link">&#8592; Back to Sign in</a>
      </div>
    </main>

    <script>
      document
        .getElementById("forgotForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("submitBtn");
          const msg = document.getElementById("msg");
          const email = document.getElementById("email").value.trim();

          btn.disabled = true;
          btn.textContent = "Sending…";
          msg.style.display = "none";

          try {
            const res = await fetch("/api/forgot-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email }),
            });
            const j = await res.json();
            msg.style.display = "block";
            if (j.success) {
              msg.className = "success";
              msg.textContent =
                j.message ||
                "If that email is registered, a reset link has been sent. Please check your inbox.";
              document.getElementById("forgotForm").reset();
            } else {
              msg.className = "error";
              msg.textContent =
                j.error || "Something went wrong. Please try again.";
            }
          } catch (err) {
            msg.style.display = "block";
            msg.className = "error";
            msg.textContent = "Network error. Please try again.";
          } finally {
            btn.disabled = false;
            btn.textContent = "Send reset link";
          }
        });
    </script>
  </body>
</html>
